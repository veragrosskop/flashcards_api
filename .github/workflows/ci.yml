name: Django CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_DB: flashcards_test
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_NAME: flashcards_test
      DATABASE_USER: ${{ secrets.CI_DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.CI_DATABASE_PASSWORD }}
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      DEBUG: False

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black (check only)
        run: |
          black . --check --diff --exclude migrations

      - name: Run migrations
        run: |
          python manage.py migrate

      - name: Run tests
        run: |
          pytest