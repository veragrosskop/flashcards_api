version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: flashcards-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .

    container_name: flashcards-api

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    env_file:
      - .env

    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.prod

    command: >
      gunicorn
      config.wsgi:application
      --bind 0.0.0.0:8000

  nginx:
    image: nginx:alpine
    container_name: flashcards-nginx

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/reload-loop.sh:/reload-loop.sh:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot

    command: sh -c "/reload-loop.sh & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    container_name: flashcards-certbot

    restart: unless-stopped

    volumes:
      - ./docker/certbot/renew-loop.sh:/renew-loop.sh:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot

    entrypoint: sh /renew-loop.sh

volumes:
  postgres_data:
  certbot_etc:
  certbot_www: